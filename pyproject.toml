# AERA — Artificial Voice Reasoning Assistant

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aera"
version = "1.0.0"
description = "AERA - Artificial Voice Reasoning Assistant / AI Operating System"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Manoj Dahal", email = "info@manoj-dahal.com.np" }]
keywords = ["ai", "agents", "memory-graph", "llm", "assistant", "operating-system"]

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "cryptography>=42.0",
    "python-multipart>=0.0.9",
    "psutil>=5.9",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5.0",
]
package = [
    "pywebview>=5.0",
    "pyinstaller>=6.0",
]
# Real neural speech. The package installs from PyPI; the voice model is a
# separate download from huggingface.co/rhasspy/piper-voices.
voice = [
    "piper-tts>=1.2",
]
# Local image analysis: dimensions, palette, brightness, sharpness and
# whether an image is a photograph or a screenshot. Needs no model and no
# network; a vision-capable provider is separate and optional.
vision = [
    "pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "anyio>=4.2",
    "ruff>=0.3",
]

[project.scripts]
aera = "aera.cli:main"

[project.gui-scripts]
# Windows/macOS launcher that opens no console window.
aera-desktop = "aera.desktop:run_desktop"

[tool.setuptools.packages.find]
include = ["aera*"]

[tool.setuptools.package-data]
# The interface is built by Vite into aera/desktop/ui-react and is not
# tracked in git, so it is included only when present at build time.
"aera.desktop" = ["ui-react/index.html", "ui-react/*.png", "ui-react/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
