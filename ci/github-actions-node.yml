name: Node.js CI

# Replaces the default GitHub Node template, which failed on every run.
#
# The template assumes package.json sits at the repository root. In this
# project the Node application is the React interface under `interface/`,
# and there is no root package.json at all. The failure was not `npm ci`
# erroring -- it never reached that step. `actions/setup-node` with
# `cache: 'npm'` looks for a lockfile from the root, finds none, and fails
# during setup, so every run died at step 3 of 6 with the three matrix legs
# cancelling each other.
#
# Two changes: point the cache at interface/package-lock.json, and run the
# npm steps from that directory.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  interface:
    name: interface (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: interface

    strategy:
      fail-fast: false
      matrix:
        # Read from the installed toolchain rather than assumed: Vite 7
        # declares engines "^20.19.0 || >=22.12.0". The template tested 18,
        # 20 and 22 -- 18 is unsupported outright, and a bare "20.x" can
        # resolve below 20.19. Both would be red crosses nobody can act on,
        # so the matrix pins the lowest version that actually works and the
        # current LTS.
        node-version: ["20.19", "22.x"]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          # Without this the cache step searches from the repository root,
          # finds no lockfile and fails before anything is installed.
          cache-dependency-path: interface/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The build writes the interface into aera/desktop/ui-react, and the
      # PyInstaller spec refuses to package without it. Checking here means
      # a broken build is caught by CI rather than at release time.
      - name: Verify the build output
        working-directory: .
        run: |
          test -f aera/desktop/ui-react/index.html \
            || { echo "the build produced no index.html"; exit 1; }
          test -d aera/desktop/ui-react/assets \
            || { echo "the build produced no assets"; exit 1; }
          echo "interface build verified"
