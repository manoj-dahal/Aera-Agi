name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check aera/ tests/

      - name: Test
        # The suite is fully offline: no API keys, no model downloads.
        run: pytest -q

      - name: Smoke test the server
        run: |
          python -m aera serve --port 8080 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/health && break
            sleep 1
          done
          curl -fsS http://localhost:8080/health | grep -q '"ready":true'
          curl -fsS -X POST http://localhost:8080/api/v1/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"hello"}' | grep -q '"success":true'

  interface:
    name: interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: interface/package-lock.json

      - name: Install
        run: cd interface && npm ci

      - name: Typecheck
        run: cd interface && npm run typecheck

      - name: Test
        run: cd interface && npm test

      # The interface is the only UI, so a broken build ships no app at all.
      - name: Build
        run: cd interface && npm run build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t aera:ci .

      - name: Run container and probe health
        run: |
          docker run -d --name aera-ci -p 8080:8080 aera:ci
          for i in $(seq 1 45); do
            curl -fsS http://localhost:8080/health && break
            sleep 2
          done
          curl -fsS http://localhost:8080/health | grep -q '"ready":true'
          docker logs aera-ci
          docker rm -f aera-ci
