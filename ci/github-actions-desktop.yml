name: Desktop build

# Builds the standalone AERA desktop application for Linux, macOS and Windows.
# Artifacts are attached to the run; tagged pushes also create a GitHub release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            artifact: AERA-linux-x86_64
          - os: macos-latest
            label: macos
            artifact: AERA-macos-universal
          - os: windows-latest
            label: windows
            artifact: AERA-windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The interface is the only UI, so it must be built before PyInstaller
      # runs: installer/aera.spec fails fast if the bundle is missing.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: interface/package-lock.json

      - name: Build interface
        run: |
          cd interface
          npm ci
          npm run typecheck
          npm test
          npm run build

      # pywebview needs the platform webview runtime. Windows ships WebView2
      # and macOS ships WebKit; Linux needs GTK + WebKit2GTK installed.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-0 libgtk-3-dev \
            libwebkit2gtk-4.1-0 libwebkit2gtk-4.1-dev \
            libcairo2-dev libgirepository1.0-dev gir1.2-webkit2-4.1 \
            python3-gi python3-gi-cairo xvfb

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,package]"

      - name: Install PyGObject (Linux)
        if: runner.os == 'Linux'
        run: pip install pygobject pycairo

      - name: Lint
        run: ruff check aera/ tests/

      - name: Test
        run: pytest -q

      - name: Build executable
        run: pyinstaller installer/aera.spec --noconfirm --clean

      # Confirm the frozen binary starts, boots the kernel and opens a window.
      # Linux uses a virtual display; the app is closed automatically.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a --server-args="-screen 0 1280x900x24" \
            timeout 60 ./dist/AERA/AERA &
          sleep 30
          pgrep -f dist/AERA/AERA >/dev/null && echo "app is running" || (echo "app exited early" && exit 1)
          pkill -f dist/AERA/AERA || true

      - name: Verify bundle contents
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   ROOT="dist/AERA.app/Contents/Resources" ;;
            Windows) ROOT="dist/AERA/_internal" ;;
            *)       ROOT="dist/AERA/_internal" ;;
          esac
          test -f "$ROOT/aera/desktop/ui-react/index.html" || (echo "interface missing from the bundle" && exit 1)
          test -d "$ROOT/aera/desktop/ui-react/assets" || (echo "interface assets missing from the bundle" && exit 1)
          test -d "$ROOT/config" || (echo "config missing from the bundle" && exit 1)
          echo "bundle contents verified"

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          if [ -d AERA.app ]; then tar -czf "../${{ matrix.artifact }}.tar.gz" AERA.app;
          else tar -czf "../${{ matrix.artifact }}.tar.gz" AERA; fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/AERA -DestinationPath "${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
