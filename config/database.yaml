# Persistence (docs/25-DATABASE.md)
# sqlite is the local-first default; switch to postgres for multi-user
# deployments and set dsn accordingly.
database:
  driver: sqlite
  path: ./storage/aera.db
  dsn: null
  pool_size: 5
  backup_enabled: true
