# Voice system (docs/08-VOICE-SYSTEM.md, docs/config/Voice.md)
voice:
  enabled: true
  wake_word: AERA
  language: en
  # Expression is always active; this is kept only so an existing
  # voice.yaml still loads. Setting it false no longer flattens delivery.
  emotion: true
  hologram_sync: true
  noise_reduction: true
  echo_cancellation: true
  speech_speed: 1.0
  pitch: 1.0
  volume: 100
