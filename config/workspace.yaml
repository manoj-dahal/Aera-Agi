# Workspace indexing (docs/14-WORKSPACE.md, docs/config/Workspace.md)
workspace:
  default: ~/Projects
  auto_index: true
  watch_changes: true
  backup: true
  git_detection: true
  docker_detection: true
  cache: true
  max_file_size_bytes: 2000000
  ignore_dirs:
    - .git
    - node_modules
    - __pycache__
    - .venv
    - venv
    - dist
    - build
    - target
    - .dart_tool
    - .mypy_cache
    - .pytest_cache
