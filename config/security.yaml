# Security (docs/21-SECURITY.md)
security:
  zero_trust: true
  encrypt_secrets: true
  audit_log: true
  sandbox_plugins: true
  # Terminal execution is off by default. When enabled, only the
  # allowlisted binaries below may run.
  allow_terminal: false
  # Outbound web access for the Web Agent. Private, loopback and link-local
  # addresses are refused even when this is enabled.
  allow_network: false
  # Reading container, image, volume and network state is always permitted.
  # Starting, stopping, restarting and removing containers is not, until
  # this is turned on.
  allow_docker_control: false
  terminal_allowlist:
    - ls
    - cat
    - pwd
    - echo
    - git
    - python3
    - node
  secret_key_file: ./storage/.secret.key
  max_upload_bytes: 20000000
