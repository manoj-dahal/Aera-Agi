# Security configuration (docs/21-SECURITY.md "Configuration")
security:
  zero_trust: true
  auth_required: false   # local-first default; true enforces bearer tokens
  rate_limit:
    max_failed_logins: 5
    lockout_seconds: 300
  ai_guard:
    prompt_injection_detection: true
    output_validation: true
  audit:
    ring_size: 500
