# Agent roster (docs/07-AGENTS.md, docs/config/Agents.md)
agents:
  core: true
  memory: true
  coding: true
  reasoning: true
  planning: true
  research: true
  writing: true
  translation: true
  workspace: true
  git: true
  security: true
  automation: true
  performance: true
  notification: true
  # Disabled by default: executes shell commands (see security.allow_terminal)
  terminal: false
  voice: true
  max_concurrent_tasks: 8
  task_timeout_seconds: 120

  # Extended roster (docs/ui-page/conversation.txt)
  ethical_hacking: true   # authorised defensive work only
  document: true
  network: true           # local diagnostics, read-only
  conversation: true
  personalization: true
  collaboration: true
  device: true
  learning: true
  update: true
  monitoring: true
  # Enabled: it reports the missing model rather than pretending to see. This
  # key was previously set twice -- false here and true below -- and YAML kept
  # the last one silently, so the file contradicted itself.
  vision: true
  # Off by default - these reach outside the machine or need extra backends:
  audio: false            # needs a speech-to-text engine
  web: false              # also requires security.allow_network
