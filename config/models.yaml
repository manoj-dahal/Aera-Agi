# AERA — Artificial Enhanced Reasoning Assistant

# Model routing (docs/config/Models.md, docs/18-LOCAL-LLM.md)
#
# routing_mode: automatic | local_first | cloud_first | manual |
#               performance | privacy | offline
models:
  default: local
  reasoning: local
  coding: local
  research: local
  vision: local
  routing_mode: local_first

  local:
    enabled: true
    provider: ollama
    model: llama3
    endpoint: http://localhost:11434
    gpu: true
    context: 32768

  embedding:
    model: text-embedding
    dimensions: 256

  # Cloud providers. Leave api_key blank to read it from the encrypted vault
  # or the matching environment variable (OPENAI_API_KEY, ANTHROPIC_API_KEY,
  # GEMINI_API_KEY, OPENROUTER_API_KEY).
  providers:
    openai:
      enabled: false
      api_key: ""
      model: gpt-4o-mini
    claude:
      enabled: false
      api_key: ""
      model: claude-sonnet-4-5
    gemini:
      enabled: false
      api_key: ""
      model: gemini-2.5-pro
