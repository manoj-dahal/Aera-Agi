# AERA — Artificial Voice Reasoning Assistant

# Memory graph (docs/06-MEMORY-GRAPH.md, docs/config/Memory.md)
memory:
  enabled: true
  graph: true
  vector_database: internal
  embeddings: text-embedding
  long_term: true
  short_term: true
  semantic: true
  episodic: true
  procedural: true
  auto_cleanup: true
  short_term_ttl_seconds: 3600
  short_term_capacity: 200
  recall_limit: 10
  importance_threshold: 0.25
