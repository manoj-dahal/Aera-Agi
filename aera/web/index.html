<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AERA — AI Operating System</title>
<link rel="stylesheet" href="/static/style.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◈</text></svg>" />
</head>
<body>
<div id="app">

  <!-- Header -->
  <header class="header">
    <div class="brand">
      <span class="logo">◈</span>
      <div>
        <h1>AERA</h1>
        <span class="tagline">AI Operating System</span>
      </div>
    </div>
    <div class="status-strip">
      <span class="chip" id="chip-project">No project</span>
      <span class="chip" id="chip-model">model —</span>
      <span class="chip" id="chip-agents">0 agents</span>
      <span class="chip" id="chip-memory">0 memories</span>
      <span class="chip status" id="chip-conn"><i class="dot"></i><span>connecting</span></span>
    </div>
  </header>

  <div class="layout">
    <!-- Left sidebar -->
    <nav class="sidebar">
      <button class="nav-item active" data-view="dashboard">Dashboard</button>
      <button class="nav-item" data-view="memory">Memory</button>
      <button class="nav-item" data-view="agents">Agents</button>
      <button class="nav-item" data-view="workspace">Workspace</button>
      <button class="nav-item" data-view="automation">Automation</button>
      <button class="nav-item" data-view="settings">Settings</button>

      <div class="sidebar-foot">
        <div class="hologram" id="hologram">
          <div class="halo"></div>
          <div class="core" id="holo-core"></div>
          <span class="emotion" id="holo-emotion">neutral</span>
        </div>
      </div>
    </nav>

    <!-- Main -->
    <main class="main">

      <!-- Dashboard -->
      <section class="view active" id="view-dashboard">
        <div class="chat-pane">
          <div class="transcript" id="transcript">
            <div class="welcome">
              <h2>AERA is online</h2>
              <p>Persistent memory, multi-agent routing and local-first AI. Ask anything — requests are automatically routed to the right specialist agent.</p>
              <div class="suggestions">
                <button class="suggestion">Write a Python function to parse JSON safely</button>
                <button class="suggestion">Plan a migration from SQLite to PostgreSQL</button>
                <button class="suggestion">Explain the trade-offs of local vs cloud LLMs</button>
                <button class="suggestion">What do you remember about this project?</button>
              </div>
            </div>
          </div>
          <div class="composer">
            <textarea id="input" rows="1" placeholder="Message AERA…  (Enter to send, Shift+Enter for newline)"></textarea>
            <button id="send" title="Send">↑</button>
          </div>
        </div>
        <aside class="context-pane">
          <h3>Live activity</h3>
          <div class="events" id="events"></div>
        </aside>
      </section>

      <!-- Memory -->
      <section class="view" id="view-memory">
        <div class="toolbar">
          <input id="mem-query" placeholder="Search the memory graph…" />
          <button id="mem-search">Search</button>
          <button id="mem-refresh" class="ghost">Refresh</button>
        </div>
        <div class="stat-row" id="mem-stats"></div>
        <div class="cards" id="mem-results"></div>
      </section>

      <!-- Agents -->
      <section class="view" id="view-agents">
        <div class="toolbar"><button id="agents-refresh" class="ghost">Refresh</button></div>
        <div class="cards" id="agent-list"></div>
      </section>

      <!-- Workspace -->
      <section class="view" id="view-workspace">
        <div class="toolbar">
          <input id="ws-path" placeholder="/path/to/your/project" />
          <button id="ws-open">Open &amp; Index</button>
        </div>
        <div class="stat-row" id="ws-stats"></div>
        <div class="toolbar">
          <input id="ws-query" placeholder="Search files…" />
          <button id="ws-search" class="ghost">Search</button>
        </div>
        <div class="cards" id="ws-results"></div>
      </section>

      <!-- Automation -->
      <section class="view" id="view-automation">
        <div class="toolbar"><button id="auto-refresh" class="ghost">Refresh</button></div>
        <div class="cards" id="auto-list"></div>
        <h3 class="section-title">Recent runs</h3>
        <div class="cards" id="auto-runs"></div>
      </section>

      <!-- Settings -->
      <section class="view" id="view-settings">
        <div class="cards" id="settings-body"></div>
      </section>

    </main>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
